name: Core change proposal
description: Propose a change to the engine, audio, belt, transport, staging, MIDI import, fixtures or tooling (needs an OK before any PR)
labels: [core-proposal]
body:
  - type: markdown
    attributes:
      value: |
        Core files (engine, audio, juggler, transport, main, stations, MIDI, room registry + footing,
        fixtures, dependencies, tooling) change only after the maintainer agrees here. Please wait
        for an OK before opening a PR; PRs that skip this step get closed.
  - type: textarea
    attributes:
      label: What's broken or missing
      description: The problem, with a repro URL or file if there is one.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why it can't live in a plugin
      description: Why this can't be done inside an instrument folder, a song or a room.
    validations:
      required: true
  - type: textarea
    attributes:
      label: The change you have in mind
      description: Which files, roughly how big, and how it keeps the invariants (time is the only state, solved up front, honest motion).
    validations:
      required: true
