<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cascade — marble melodies</title>
<style>
  :root{
    --ink:#cfd6e6; --dim:#5a6178; --amber:#ffb764;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#07060e;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  canvas{display:block}
  #hud{position:fixed;top:18px;left:20px;color:var(--ink);pointer-events:none;user-select:none}
  #hud h1{font-size:13px;font-weight:600;letter-spacing:.35em;text-transform:uppercase}
  #song{pointer-events:auto;display:block;margin-top:10px;background:rgba(7,6,14,.6);
    color:var(--amber);border:1px solid rgba(255,183,100,.35);border-radius:8px;
    font:inherit;font-size:11px;letter-spacing:.12em;padding:6px 10px;cursor:pointer}
  #song:focus-visible{outline:none;border-color:var(--amber)}
  #songsub{font-size:10px;color:var(--dim);margin-top:6px;letter-spacing:.08em}
  #note{position:fixed;bottom:20px;left:20px;color:var(--dim);font-size:11px;letter-spacing:.2em;min-height:14px;max-width:38vw;overflow:hidden;white-space:nowrap}
  #note b{color:var(--amber);font-weight:600}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(7,6,14,.35),rgba(7,6,14,.92));z-index:10;
    transition:opacity .8s ease}
  #overlay.gone{opacity:0;pointer-events:none}
  #play{pointer-events:auto;cursor:pointer;background:none;border:1px solid rgba(255,183,100,.5);
    color:var(--amber);font:inherit;font-size:12px;letter-spacing:.4em;text-transform:uppercase;
    padding:16px 34px 16px 38px;border-radius:999px;transition:all .25s ease}
  #play:hover,#play:focus-visible{background:rgba(255,183,100,.12);border-color:var(--amber);box-shadow:0 0 40px rgba(255,183,100,.25);outline:none}
  #mute{position:fixed;top:18px;right:20px;background:none;border:none;cursor:pointer;
    color:var(--dim);font:inherit;font-size:11px;letter-spacing:.2em;padding:6px}
  #mute:hover{color:var(--ink)}
  #astate{position:fixed;bottom:20px;right:20px;color:var(--dim);font-size:10px;letter-spacing:.12em;opacity:.75;text-align:right;max-width:55vw}
  #cams{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
  .camb{background:rgba(7,6,14,.55);border:1px solid rgba(90,97,120,.45);color:var(--dim);
    font:inherit;font-size:10px;letter-spacing:.18em;padding:6px 13px;border-radius:999px;cursor:pointer;
    transition:all .2s ease}
  .camb.on{border-color:currentColor;background:rgba(7,6,14,.8)}
  .camb:focus-visible{outline:none;border-color:var(--ink)}
</style>
</head>
<body>
<div id="hud">
  <h1>Cascade</h1>
  <select id="song" aria-label="choose melody"></select>
  <p id="songsub"></p>
</div>
<div id="note"></div>
<div id="cams"></div>
<button id="mute" aria-label="mute">SOUND&nbsp;ON</button>
<div id="astate"></div>
<div id="overlay"><button id="play">Drop the marble</button></div>

/* ---- mutable song state, filled by buildWorld() ---- */

const CAMCOLORS = {auto:'#ffe9c9', all:'#cfd6e6', lead:'#ffaa55', alto:'#c08bff', bass:'#66aaff'};
const camsEl = document.getElementById('cams');
function renderCamButtons(){
  camsEl.innerHTML = '';
  if (tracks.length < 2){ camsEl.style.display = 'none'; camMode = 'auto'; return; }
  camsEl.style.display = 'flex';
  ['auto', 'all', ...tracks.map(t => t.role)].forEach(m => {
    const b = document.createElement('button');
    b.className = 'camb' + (camMode === m ? ' on' : '');
    if (camMode === m) b.style.color = CAMCOLORS[m];
    b.textContent = m.toUpperCase();
    b.addEventListener('click', () => { camMode = m; renderCamButtons(); });
    camsEl.appendChild(b);
  });
}
const ROLL_T = 2.6;                                    // seconds on the rail
const hueOf = n => Math.max(0, SCALE.indexOf(n.replace(/\d/,''))) / Math.max(1, SCALE.length);
const octaveOf = n => +n.match(/\d/)[0];

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07060e);
scene.fog = new THREE.FogExp2(0x07060e, 0.026);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 200);

scene.add(new THREE.AmbientLight(0x223, 1.4));
const key = new THREE.DirectionalLight(0x8899ff, .5);
key.position.set(-6, 10, 4); scene.add(key);

/* --- one-shot procedural environment map → real chrome --- */
function makeEnv(){
  const envScene = new THREE.Scene();
  const grad = (() => {
    const c = document.createElement('canvas'); c.width = 4; c.height = 256;
    const g = c.getContext('2d').createLinearGradient(0,0,0,256);
    g.addColorStop(0,'#3a4d8f'); g.addColorStop(.45,'#0c0d1d');
    g.addColorStop(.75,'#05040a'); g.addColorStop(1,'#000');
    const x = c.getContext('2d'); x.fillStyle = g; x.fillRect(0,0,4,256);
    return new THREE.CanvasTexture(c);
  })();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50,16,16),
    new THREE.MeshBasicMaterial({map:grad, side:THREE.BackSide})));

/* ---------------- world builder ----------------
   Solver per track: v0 = (ΔP − ½·g·dt²)/dt — exact, no drift.
   Descent is proportional to time, so parallel tracks fall together. */
function buildTrack(melody, zBase, role, rig, delayBeats = 0, deep = false){
  const isBass = role === 'bass';
  const voiceDeep = isBass || deep;
  const padScale = isBass ? 1.4 : (role === 'alto' ? .85 : 1);
  const rollT = ROLL_T + delayBeats * BEAT;             // late entry = lazy roll
  const pads = []; let t = 0;
  {
    let p = new THREE.Vector3(0, -2.2 * delayBeats * BEAT, zBase), dir = isBass ? -1 : 1;
    melody.forEach(([note, beats], i) => {
      const dt = beats * BEAT;
      pads.push({pos: p.clone(), note, dt, t});
      t += dt;
      if (i % 4 === 3) dir *= -1;                       // weave
      p = p.clone().add(new THREE.Vector3(
        dir * (0.9 + dt * 2.0),
        -dt * 2.2,                                      // time-proportional drop
        Math.sin(i * (isBass ? 1.1 : 1.3)) * (isBass ? 1.0 : 1.4)
      ));
    });
  }
  const arcs = [];
  for (let i = 0; i < pads.length; i++){
    const a = pads[i];
    const target = (i === pads.length-1)
      ? a.pos.clone().add(new THREE.Vector3(0,-9,0))
      : pads[i+1].pos.clone();
    const dt = a.dt;
    arcs.push(target.sub(a.pos).addScaledVector(G, -.5*dt*dt).divideScalar(dt));
  }

  // intro rail aimed along the launch direction
  const launchDir = arcs[0].clone().normalize();
  const p0 = pads[0].pos;
  const rail = new THREE.CatmullRomCurve3([
    p0.clone().addScaledVector(launchDir,-9).add(new THREE.Vector3(0, 7.5, 1.5)),
    p0.clone().addScaledVector(launchDir,-6.5).add(new THREE.Vector3(0, 4.6,-1.2)),
    p0.clone().addScaledVector(launchDir,-4).add(new THREE.Vector3(0, 2.2, .6)),
    p0.clone().addScaledVector(launchDir,-1.6).add(new THREE.Vector3(0, .55, 0)),
    p0.clone()
  ]);
  {
    const frames = rail.computeFrenetFrames(120, false);
    const samples = rail.getSpacedPoints(120);
    const w = isBass ? .3 : .22;
    [-w, w].forEach(off => {
      const pts = samples.map((pt,i)=> pt.clone().addScaledVector(frames.binormals[i], off).add(new THREE.Vector3(0,-.16,0)));
      world.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 120, .06, 10), chrome));
    });
    for (let i=4;i<118;i+=9){
      const s = new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,isBass?.78:.62,8), chrome);
      s.position.copy(samples[i]).y -= .2;
      s.rotation.z = Math.PI/2;
      s.lookAt(samples[i+1].x, s.position.y, samples[i+1].z);
      s.rotateOnAxis(new THREE.Vector3(0,1,0), Math.PI/2);
      world.add(s);
    }
  }

  // pads: normal bisects incoming & outgoing velocity
  const padObjs = pads.map((pad, i) => {
    const prev = (i-1+pads.length) % pads.length;
    const vin = arcs[prev].clone().addScaledVector(G, pads[prev].dt);
    const n = arcs[i].clone().normalize().sub(vin.clone().normalize()).normalize();
    if (n.y < .2) n.set(0,1,0);
    const g = new THREE.Group();
    g.position.copy(pad.pos).y -= .12;
    g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), n);
    g.scale.setScalar(padScale);
    const body = new THREE.Mesh(padGeo, new THREE.MeshStandardMaterial({
      color: isBass ? 0x7e8db0 : 0x9aa6bd, metalness:1, roughness:.18, envMap, envMapIntensity:1.2}));
    const rim = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(hueOf(pad.note), .8, .55),
      transparent:true, opacity:.18}));
    rim.rotation.x = Math.PI/2; rim.position.y = .09;
    g.add(body, rim); world.add(g);
    return {g, rim, body, flash:0, hue:hueOf(pad.note),
            base: g.position.clone(), n: n.clone(),
            amp: THREE.MathUtils.clamp(arcs[i].dot(n)*.07, .05, 1.6)};
  });

  // landing pool
  const poolPos = pads[pads.length-1].pos.clone().add(new THREE.Vector3(0,-8.6,0));
  const pool = new THREE.Mesh(new THREE.CircleGeometry(isBass?2.6:2.2, 40),
    new THREE.MeshBasicMaterial({color: rig.glow.getHex(), transparent:true, opacity:.10}));
  pool.rotation.x = -Math.PI/2; pool.position.copy(poolPos); world.add(pool);

  rig.group.visible = true;
  return {pads, arcs, rail, padObjs, poolPos, pool, rig, role, isBass, deep:voiceDeep, rollT, lastIdx:-1, total:t};
}

function buildWorld(keyName){

/* ---------------- audio: raw Web Audio, zero dependencies ----------------
   iOS WebKit bug: a context created before the first user gesture can report
   state "running" while its clock stays frozen at 0 and emits nothing.
   So: build the ENTIRE context inside the gesture, and watchdog the clock. */
let muted = false, audioReady = false;
let ctx = null, master = null, rebuilds = 0;
let eDL = null, eDR = null;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const stateEl = document.getElementById('astate');
function showState(extra){
  stateEl.textContent = ctx
    ? `audio: ${ctx.state} · t=${ctx.currentTime.toFixed(1)}` +
      (lastPath ? ` · via ${lastPath}` : '') +
      (rebuilds ? ` · rebuilt×${rebuilds}` : '') + (extra || '')
    : 'audio: tap to start';
}
setInterval(showState, 1000);

function buildAudio(){                                 // MUST be called from a gesture
  if (ctx){ try { ctx.close(); } catch(e){} }
  ctx = new AC();
  master = ctx.createGain(); master.gain.value = .9;
  const out = ctx.createGain();
  master.connect(out);
  // small stereo echo — no convolver, nothing async
  eDL = ctx.createDelay(1); eDR = ctx.createDelay(1);
  eDL.delayTime.value = BEAT/2; eDR.delayTime.value = BEAT*.75;
  const fb = ctx.createGain(); fb.gain.value = .3;
  const wet = ctx.createGain(); wet.gain.value = .25;
  master.connect(eDL); eDL.connect(eDR); eDR.connect(fb); fb.connect(eDL);
  eDL.connect(wet); eDR.connect(wet); wet.connect(out);
  out.connect(ctx.destination);
  if (isIOS){                                          // also feed a real media element
    const msd = ctx.createMediaStreamDestination();
    out.connect(msd);
    audioEl.srcObject = msd.stream;
    audioEl.play().catch(()=>{});
  }
  ctx.resume().catch(()=>{});
  ctx.onstatechange = () => showState();
  audioReady = true;
  // watchdog: report a zombie clock; rebuilds must happen inside a tap
  const born = performance.now();
  const probe = setInterval(() => {
    if (!ctx) return clearInterval(probe);
    if (ctx.currentTime > .05){ clearInterval(probe); showState(); return; }
    if (performance.now() - born > 900){ clearInterval(probe); showState(' · ctx dead, using samples'); }
  }, 200);
  showState();
}

/* every tap: prime samples, retry/rebuild the context (gesture context!) */
['touchend','pointerdown'].forEach(ev => addEventListener(ev, () => {
  if (!started) return;
  primeSamples();
  if (!ctx) buildAudio();
  else if (ctx.currentTime < .05 && rebuilds < 3){ rebuilds++; buildAudio(); }
  else if (ctx.state !== 'running') ctx.resume().catch(()=>{});
  showState();
}, {passive:true}));

const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function noteHz(n){
  const m = n.match(/^([A-G]#?)(\d)$/);
  return 440 * Math.pow(2, (NAMES.indexOf(m[1]) - 9)/12 + (+m[2] - 4));
}

/* ---- Plan B: pre-rendered WAV samples through <audio> elements ----
   When the iframe denies AudioContext activation but allows media playback,
   this path still sings. Bass notes get a deeper, rounder render. */
function renderNoteWav(freq, bass){
  const sr = 22050, dur = bass ? 3.0 : 2.6, N = (sr*dur)|0;
  const s = new Float32Array(N);
  const decay = bass ? 1.7 : 2.6;
  const tickF = bass ? 700 : 2400, tickA = bass ? .06 : .08;
  const tickN = (.025*sr)|0;
  for (let n=0;n<N;n++){
    const t = n/sr;
    const env = Math.exp(-t*decay) * Math.min(1, t/(bass?.008:.004));
    s[n] = bass
      ? env*( .65*Math.sin(6.2832*freq*t)
            + .3*Math.sin(6.2832*freq*.5*t)*Math.exp(-t*1.2)   // sub-octave depth
            + .26*Math.sin(6.2832*freq*2.002*t)*Math.exp(-t*2.2)
            + .05*Math.sin(6.2832*freq*3.0*t)*Math.exp(-t*5))
      : env*( .55*Math.sin(6.2832*freq*t)
            + .22*Math.sin(6.2832*freq*2.004*t)*Math.exp(-t*1.5)
            + .12*Math.sin(6.2832*freq*2.76*t)*Math.exp(-t*5)   // inharmonic tine
            + .06*Math.sin(6.2832*freq*4.2*t)*Math.exp(-t*8)    // sparkle
            + .08*Math.sin(6.2832*freq*3.01*t)*Math.exp(-t*4));
    if (n < tickN) s[n] += tickA*Math.sign(Math.sin(6.2832*tickF*t))*Math.exp(-t*120);
  }
  const d = ((BEAT/2)*sr)|0;                            // baked-in echo
  const eg = bass ? .18 : .28;
  for (let n=d;n<N;n++) s[n] += eg*s[n-d];
  let peak = 0; for (let n=0;n<N;n++) peak = Math.max(peak, Math.abs(s[n]));
  const k = (bass ? .98 : .85)/Math.max(peak, 1e-6);
  const buf = new ArrayBuffer(44 + N*2), v = new DataView(buf);
  const W = (o,str) => { for(let i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); };
  W(0,'RIFF'); v.setUint32(4, 36+N*2, true); W(8,'WAVE'); W(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  W(36,'data'); v.setUint32(40, N*2, true);
  for (let n=0;n<N;n++) v.setInt16(44+n*2, Math.max(-1,Math.min(1,s[n]*k))*32767, true);
  return new Blob([buf], {type:'audio/wav'});
}
let bank = {}, primed = false;
const bankKey = (note, bass) => note + (bass ? '|b' : '');
function rebuildBank(){
  Object.values(bank).forEach(a => {
    try { a.pause(); } catch(e){}
    if (a.src) URL.revokeObjectURL(a.src);
    a.remove();
  });
  bank = {}; primed = false;
  const wanted = new Map();
  tracks.forEach(tr => tr.pads.forEach(p => wanted.set(bankKey(p.note, tr.deep), {note:p.note, bass:tr.deep})));
  wanted.forEach(({note, bass}, k) => {
    const a = document.createElement('audio');
    a.setAttribute('playsinline',''); a.preload = 'auto';
    a.src = URL.createObjectURL(renderNoteWav(noteHz(note), bass));
    a.addEventListener('error', () => stateEl.textContent = 'audio: sample blocked');
    document.body.appendChild(a);
    bank[k] = a;
  });
}
function primeSamples(){                                // gesture-unlocks every element
  if (primed) return;
  primed = true;
  Object.values(bank).forEach(a => {
    const pr = a.play();
    if (pr && pr.then) pr.then(() => { a.pause(); a.currentTime = 0; })
                         .catch(() => { primed = false; });
  });

let lastPath = '';
function playNote(note, bass){
  if (ctx && ctx.state === 'running' && ctx.currentTime > .05){
    pluck(note, bass); lastPath = 'webaudio'; return;
  }
  const a = bank[bankKey(note, bass)];
  if (a){
    try { a.currentTime = 0; } catch(e){}
    a.play().catch(()=>{});
    lastPath = 'samples';
  }

function pluck(note, bass){
  if (!ctx) return;
  const f = noteHz(note), t = ctx.currentTime;
  const dur = bass ? 2.6 : 1.6;
  const g = ctx.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(bass ? .7 : .5, t + (bass ? .01 : .005));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  const o1 = ctx.createOscillator(); o1.type = bass ? 'sine' : 'triangle'; o1.frequency.value = f;
  const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * (bass ? 2.002 : 2.004);
  const g2 = ctx.createGain(); g2.gain.value = bass ? .3 : .3;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o1.start(t); o2.start(t); o1.stop(t+dur+.1); o2.stop(t+dur+.1);
  if (bass){                                            // sub-octave depth
    const o3 = ctx.createOscillator(); o3.type = 'sine'; o3.frequency.value = f*.5;
    const g3 = ctx.createGain(); g3.gain.value = .3;
    o3.connect(g3); g3.connect(g); o3.start(t); o3.stop(t+dur+.1);
  } else {                                              // inharmonic tine shimmer
    const o4 = ctx.createOscillator(); o4.type = 'sine'; o4.frequency.value = f*2.76;
    const g4 = ctx.createGain();
    g4.gain.setValueAtTime(.14, t);
    g4.gain.exponentialRampToValueAtTime(.0001, t + .5);
    o4.connect(g4); g4.connect(g); o4.start(t); o4.stop(t + .6);
  }
  // impact transient
  const k = ctx.createOscillator(); k.type = 'square'; k.frequency.value = bass ? 700 : 2400;
  const kg = ctx.createGain();
  kg.gain.setValueAtTime(bass ? .03 : .05, t);
  kg.gain.exponentialRampToValueAtTime(.0001, t + .03);
  k.connect(kg); kg.connect(master); k.start(t); k.stop(t + .05);
}
const noteEl = document.getElementById('note');
function strike(tr, i){
  const pad = tr.pads[i], po = tr.padObjs[i];
  po.flash = 1;
  tr.rig.lamp.intensity = 5;
  if (tr.role === 'lead') noteEl.innerHTML = `<b>${pad.note}</b>&nbsp; ·&nbsp; ${'·'.repeat(Math.min(i, 40))}`;
  const rp = ripples[rippleIdx++ % ripples.length];
  rp.mesh.position.copy(pad.pos);
  rp.mesh.quaternion.copy(po.g.quaternion);
  rp.mesh.rotateX(Math.PI/2);
  rp.mesh.material.color.setHSL(po.hue, .8, .6);
  rp.mesh.scale.setScalar(tr.isBass ? 1.4 : 1);
  rp.life = 0;
  // JUICE: sparks, squash, punch
  const sparkColor = new THREE.Color().setHSL(po.hue, .85, .62);
  spawnBurst(pad.pos.clone().add(UP), sparkColor,

             2.4 + Math.min(pad.dt*1.6, 3));
  tr.rig.squash = 1;
  if (tr.role === 'lead'){
    shakeAmp = Math.min(shakeAmp + .04 + pad.dt*.05, .15);
    expoKick = 1;

    try { playNote(pad.note, tr.deep); } catch(e){ /* audio must never break the run */ }
  }

/* pad swing: retract, then swing up to meet the marble exactly at impact.
   phase = now − hit time. A = swing amplitude (impulse-scaled). */
function padOffset(phase, A){
  const W = .3 + A*.35;                                 // bigger hits telegraph longer
  const S = .1;                                         // stroke time
  if (phase < -W || phase > .6) return 0;
  if (phase < -S){                                      // wind-up: ease into retraction
    const u = (phase + W) / (W - S);
    return -A * u*u;
  }
  if (phase < 0){                                       // the stroke: swing hard into contact
    const u = (phase + S) / S;
    return -A * (1 - u*u*u);
  }
  return A * .33 * Math.sin(phase*16) * Math.exp(-phase*8);  // follow-through wobble
}

/* position+velocity of a track's marble at loop-time T; fires strikes */
function trackPos(tr, T){
  if (T < tr.rollT){
    const u = T / tr.rollT;
    const e = Math.min(u*u*(3-2*u)*.65 + u*.35, 1);
    return {pos: tr.rail.getPointAt(e).add(UP),
            vel: tr.rail.getTangentAt(Math.min(e,.999)).multiplyScalar(6),
            plunge:false, nextIdx:0, prog:u, curDt:9, nextDt: tr.pads[0].dt};
  }
  let at = T - tr.rollT, i = 0;
  while (i < tr.pads.length && at >= tr.pads[i].dt){ at -= tr.pads[i].dt; i++; }
  if (i >= tr.pads.length){                             // tail: continue last arc
    const a = tr.pads[tr.pads.length-1];
    const t2 = a.dt + (T - (tr.rollT + a.t + a.dt));
    const pos = a.pos.clone()
      .addScaledVector(tr.arcs[tr.arcs.length-1], t2)
      .addScaledVector(G, .5*t2*t2);
    return {pos, vel: tr.arcs[tr.arcs.length-1].clone().addScaledVector(G, t2),
            plunge:true, nextIdx:-1, prog:0, curDt:9, nextDt:9};
  }
  if (i !== tr.lastIdx){ tr.lastIdx = i; strike(tr, i); }
  return {pos: tr.pads[i].pos.clone()
            .addScaledVector(tr.arcs[i], at)
            .addScaledVector(G, .5*at*at)
            .add(UP),
          vel: tr.arcs[i].clone().addScaledVector(G, at),
          plunge:false,
          nextIdx: i+1 < tr.pads.length ? i+1 : -1,
          prog: at / tr.pads[i].dt,
          curDt: tr.pads[i].dt,
          nextDt: i+1 < tr.pads.length ? tr.pads[i+1].dt : 9};
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const T = started ? clock.elapsedTime % (ROLL_T + LOOP_T) : 0;
  if (started && T < dt) tracks.forEach(tr => { tr.lastIdx = -1; tr.splashed = false; });   // loop reset

  let leadPos = null;
  const marblePts = [];
  tracks.forEach(tr => {
    const rig = tr.rig;
    const r = started ? trackPos(tr, T)
                      : {pos: tr.rail.getPointAt(0).add(UP),
                         vel: tr.rail.getTangentAt(0), plunge:false, nextIdx:0, prog:0};
    marblePts.push({p: r.pos, w: tr.role === 'lead' ? 1.7 : 1, role: tr.role});
    tr._st = {dt: r.curDt, next: r.nextDt, prog: r.prog};
    if (tr.role === 'lead') leadPos = r.pos;
    let visible = true;
    if (r.plunge){
      const fade = THREE.MathUtils.clamp((tr.poolPos.y + 1 - r.pos.y), 0, 1);
      rig.halo.material.opacity = .85 * (1-fade);
      rig.core.material.emissiveIntensity = 2.2*(1-fade)+.1;
      tr.pool.material.opacity = .10 + fade*.3;
      if (!tr.splashed && r.pos.y < tr.poolPos.y + .4){
        tr.splashed = true;
        spawnBurst(tr.poolPos.clone().add(UP), rig.glow, 22, 5);
      }
      if (r.pos.y < tr.poolPos.y) visible = false;
    } else {
      rig.halo.material.opacity = .85;
      rig.core.material.emissiveIntensity = 2.2;
      tr.pool.material.opacity += (.10 - tr.pool.material.opacity)*.05;
    }
    rig.group.visible = visible;
    rig.group.position.copy(r.pos);
    rig.core.rotation.x += dt*6; rig.core.rotation.z += dt*3.4;
    rig.lamp.intensity += (2.4 - rig.lamp.intensity) * dt * 8;

    // squash & stretch along velocity
    const speed = r.vel.length();
    if (speed > .01) rig.deform.quaternion.setFromUnitVectors(UPY, r.vel.clone().normalize());
    rig.squash *= (1 - dt*9);
    const sq = rig.squash;
    const stretch = 1 + Math.min(speed*.014, .4);
    const sy = stretch*(1-sq) + .55*sq;
    const sxz = (1/Math.sqrt(stretch))*(1-sq) + 1.3*sq;
    rig.deform.scale.set(sxz, sy, sxz);

    if (started && visible && trailTick > .022){
      const s = trail[trailHead++ % TRAIL];
      s.position.copy(r.pos);
      s.material.color.copy(rig.glow);
      s.material.opacity = .5;
      s.scale.setScalar(tr.isBass ? .95 : .7);
    }
    tr.padObjs.forEach((po, idx) => {
      po.flash *= (1 - dt*4);
      const pre = (idx === r.nextIdx) ? r.prog*r.prog : 0;   // anticipation glow
      po.rim.material.opacity = .18 + po.flash*.85 + pre*.55;
      po.rim.scale.setScalar(1 + pre*.22 + po.flash*.12);
      po.body.material.emissive.setHSL(po.hue, .7, po.flash*.32 + pre*.07);
      const phase = (started ? T : 0) - (tr.rollT + tr.pads[idx].t);
      po.g.position.copy(po.base).addScaledVector(po.n, padOffset(phase, po.amp));
    });
  });
  if (trailTick > .022) trailTick = 0;
  trailTick += dt;
  trail.forEach(s => { s.material.opacity *= (1 - dt*3.2); s.scale.multiplyScalar(1 - dt*.9); });

  ripples.forEach(r => {
    if (r.life < 1){
      r.life = Math.min(1, r.life + dt*1.6);
      const s = 1 + r.life*3.2;
      r.mesh.scale.set(s,s,s);
      r.mesh.material.opacity = (1-r.life)*.8;
    } else r.mesh.material.opacity = 0;
  });

  // sparks
  parts.forEach(p => {
    if (p.life < 1){
      p.life = Math.min(1, p.life + dt*1.9);
      p.vel.y -= 9*dt;
      p.s.position.addScaledVector(p.vel, dt);
      const o = 1 - p.life;
      p.s.material.opacity = o*o*.9;
      p.s.scale.setScalar(p.s0*(1 + p.life*.5));
    } else p.s.material.opacity = 0;
  });

  // exposure pop
  expoKick *= (1 - dt*6);
  renderer.toneMappingExposure = 1.15 + expoKick*.2;

  // DIRECTOR: the timeline is known, so cut to the action before it happens
  let effMode = camMode;
  if (camMode === 'auto'){
    let want = 'all', score = 1.0;
    tracks.forEach(tr => {
      const s = tr._st; if (!s) return;
      // a big moment = a long arc in progress, or one about to launch
      const m = Math.max(s.dt < 8 ? s.dt : 0, (s.prog > .55 && s.next < 8) ? s.next : 0);
      if (m >= 1.05 && m > score){ score = m; want = tr.role; }
    });
    if (want === 'all' && tracks[0]._st && tracks[0]._st.dt <= .33) want = 'lead';  // shred cam
    if (want !== autoWant && clock.elapsedTime - lastCut > 2.2){
      autoWant = want; lastCut = clock.elapsedTime;
    }
    effMode = autoWant;
  }

  // camera: follow the chosen marble, or frame them all
  const sway = reduceMotion ? 0 : Math.sin(clock.elapsedTime*.21);
  const followed = effMode !== 'all' ? marblePts.find(m => m.role === effMode) : null;
  const focus = new THREE.Vector3();
  let back = Math.max(1, 1.3 / Math.min(camera.aspect, 1.3));
  if (followed){
    focus.copy(followed.p);
    back *= .92;                                        // tight, personal chase
  } else {
    let wSum = 0;
    marblePts.forEach(m => { focus.addScaledVector(m.p, m.w); wSum += m.w; });
    focus.divideScalar(wSum);
    let spread = 0;
    marblePts.forEach(m => spread = Math.max(spread, m.p.distanceTo(focus)));
    back *= (1 + Math.min(spread * .075, .7));
  }
  const ideal = focus.clone().add(new THREE.Vector3((4.5 + sway*2.2)*back, 2.6*back, (9.5 - sway*1.4)*back));
  camPos.lerp(ideal, 1 - Math.pow(.0015, dt));
  camTarget.lerp(focus, 1 - Math.pow(.0008, dt));
  camera.position.copy(camPos);
  shakeAmp *= (1 - dt*7);
  if (!reduceMotion && shakeAmp > .002){
    camera.position.x += (Math.random()-.5)*shakeAmp;
    camera.position.y += (Math.random()-.5)*shakeAmp;
  }
  camera.lookAt(camTarget);

  renderer.render(scene, camera);
}
animate();

/* ---------------- controls ---------------- */
document.getElementById('play').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('gone');
  clock.start(); started = true;                        // visuals never wait on audio
  try { initAudio(); } catch(e){ stateEl.textContent = 'audio: failed'; }
  keepAwake();
});
let wakeLock = null;
async function keepAwake(){
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && started) keepAwake();
});
sel.addEventListener('change', () => {
  buildWorld(sel.value);
  primeSamples();                                       // change event is a gesture: unlock new bank
  showState();
});
document.getElementById('mute').addEventListener('click', e => {
  muted = !muted;
  e.target.textContent = muted ? 'SOUND OFF' : 'SOUND ON';
  if (!muted){
    if (!ctx) buildAudio();
    else ctx.resume().catch(()=>{});
    primeSamples();
    try { playNote('E5', false); } catch(e){}           // E5 exists in every song
  }
  showState();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
