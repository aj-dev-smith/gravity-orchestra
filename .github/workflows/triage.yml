name: triage
# Labels a PR `machine` (only one NEW src/instruments/<key>/ folder + its test/inst-<key>.test.js),
# `room` (only one NEW src/rooms/<key>.js + its <key>-*.js helpers + its test/room-<key>.test.js) or
# `core` (touches files that need a maintainer OK first), and on a `core` PR from outside with no
# linked issue, comments ONCE pointing at CONTRIBUTING.md.
#
# SAFETY: pull_request_target runs THIS file from the base branch with a write token. It must never
# check out, build, install or run anything from the PR. It only reads the PR's file list and body
# through the API and treats them as data (regex tests, API parameters). No `${{ }}` of PR-controlled
# values appears anywhere below, and there is no shell step. Keep it that way.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  triage:
    if: github.repository == 'aj-dev-smith/orchestrion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            const files = await github.paginate(github.rest.pulls.listFiles,
              { owner, repo, pull_number: issue_number, per_page: 100 });
            const paths = files.flatMap(f => f.previous_filename ? [f.filename, f.previous_filename] : [f.filename]);

            // the core: keep in step with CONTRIBUTING.md / AGENTS.md
            const CORE = [
              /^src\/engine\.js$/, /^src\/audio\.js$/, /^src\/juggle[^/]*$/, /^src\/transport\.js$/,
              /^src\/main\.js$/, /^src\/instruments\/[^/]+$/, /^src\/midi\//, /^src\/rooms\/index\.js$/,
              /^src\/rooms\/footing[^/]*$/, /^test\/fixtures\//, /^package(-lock)?\.json$/,
              /^vite\.config\.js$/, /^deploy\.sh$/, /^\.github\//,
            ];
            const isCore = paths.some(p => CORE.some(re => re.test(p)));

            // a machine: every path in ONE instrument folder or its own test, and the folder is new
            let isMachine = false;
            const dirs = new Set(), tests = new Set();
            let other = false;
            for (const p of paths) {
              let m;
              if ((m = /^src\/instruments\/([a-z0-9_-]+)\/[^]+$/.exec(p))) dirs.add(m[1]);
              else if ((m = /^test\/inst-([a-z0-9_-]+)\.test\.js$/.exec(p))) tests.add(m[1]);
              else other = true;
            }
            if (!other && !isCore && dirs.size === 1) {
              const [key] = dirs;
              if ([...tests].every(t => t === key)) {
                try {
                  await github.rest.repos.getContent({ owner, repo, path: `src/instruments/${key}`, ref: pr.base.sha });
                } catch (e) {
                  if (e.status === 404) isMachine = true; else throw e;
                }
              }
            }

            // a room: every path a NEW src/rooms/<key>.js, its own src/rooms/<key>-*.js helpers or its
            // test/room-<key>.test.js (src/rooms/README.md), with the room file itself in the PR
            let isRoom = false;
            const rkeys = new Set();
            let rother = false, rmain = false;
            for (const p of paths) {
              let m;
              if ((m = /^src\/rooms\/([a-z][a-z0-9]*)\.js$/.exec(p))) { rkeys.add(m[1]); rmain = true; }
              else if ((m = /^src\/rooms\/([a-z][a-z0-9]*)-[^/]+\.js$/.exec(p))) rkeys.add(m[1]);
              else if ((m = /^test\/room-([a-z][a-z0-9]*)\.test\.js$/.exec(p))) rkeys.add(m[1]);
              else rother = true;
            }
            if (!rother && !isCore && rmain && rkeys.size === 1) {
              const [key] = rkeys;
              try {
                await github.rest.repos.getContent({ owner, repo, path: `src/rooms/${key}.js`, ref: pr.base.sha });
              } catch (e) {
                if (e.status === 404) isRoom = true; else throw e;
              }
            }

            const want = { machine: isMachine, room: isRoom, core: isCore };
            const COLORS = { machine: '1f883d', room: '0969da', core: 'd1242f' };
            const have = new Set(pr.labels.map(l => l.name));
            for (const [name, on] of Object.entries(want)) {
              if (on && !have.has(name)) {
                try { await github.rest.issues.getLabel({ owner, repo, name }); }
                catch (e) {
                  if (e.status !== 404) throw e;
                  await github.rest.issues.createLabel({ owner, repo, name, color: COLORS[name] }).catch(() => {});
                }
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
              } else if (!on && have.has(name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name }).catch(() => {});
              }
            }

            const insider = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association);
            const body = pr.body || '';
            const linked = /(^|[^\w&])#\d+\b/.test(body) ||
              /github\.com\/[\w.-]+\/[\w.-]+\/(issues|discussions)\/\d+/.test(body);
            if (isCore && !linked && !insider) {
              const MARK = '<!-- triage:core-no-issue -->';
              const comments = await github.paginate(github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 });
              if (!comments.some(c => (c.body || '').includes(MARK))) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: [
                  MARK,
                  'Thanks for the PR. It touches core files (engine, audio, belt, transport, staging, MIDI import, fixtures, dependencies or tooling), and those change only after an issue the maintainer has agreed to.',
                  '',
                  'Please link that issue in the PR description (`#123`), or open a **Core change proposal** issue first. Orchestrion has one maintainer, so core PRs without one may be closed.',
                  '',
                  `The fast lane is a new machine: one folder plus one test file. See [CONTRIBUTING.md](https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md).`,
                ].join('\n') });
              }
            }
            core.info(`machine=${isMachine} room=${isRoom} core=${isCore} linked=${linked} insider=${insider}`);
