<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cascade — marble melody machine</title>
<meta name="description" content="The melody is authored first; the physics is solved backward from it. Watch marbles play Beethoven — or drop any MIDI file and the solver does the rest.">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="canonical" href="https://cascade.ajsmithhq.com/">
<meta name="theme-color" content="#07060e">
<meta property="og:type" content="website">
<meta property="og:title" content="Cascade — marble melody machine">
<meta property="og:description" content="Melodies solved into ballistic marble physics. Drop any MIDI file — the solver does the rest.">
<meta property="og:url" content="https://cascade.ajsmithhq.com/">
<meta property="og:image" content="https://cascade.ajsmithhq.com/og.png">
<meta property="og:image:width" content="1200">

<style>
  :root{
    --ink:#cfd6e6; --dim:#5a6178; --amber:#ffb764;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#07060e;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  canvas{display:block}
  #hud{position:fixed;top:18px;left:20px;color:var(--ink);pointer-events:none;user-select:none}
  #hud h1{font-size:13px;font-weight:600;letter-spacing:.35em;text-transform:uppercase}
  #song{pointer-events:auto;display:block;margin-top:10px;background:rgba(7,6,14,.6);
    color:var(--amber);border:1px solid rgba(255,183,100,.35);border-radius:8px;
    font:inherit;font-size:11px;letter-spacing:.12em;padding:6px 10px;cursor:pointer}
  #song:focus-visible{outline:none;border-color:var(--amber)}
  #songsub{font-size:10px;color:var(--dim);margin-top:6px;letter-spacing:.08em}
  #share{pointer-events:auto;display:block;margin-top:8px;background:none;border:1px solid rgba(90,97,120,.45);
    color:var(--dim);font:inherit;font-size:10px;letter-spacing:.18em;padding:5px 12px;border-radius:999px;cursor:pointer}
  #share:hover{color:var(--amber);border-color:rgba(255,183,100,.5)}
  #note{position:fixed;bottom:20px;left:20px;color:var(--dim);font-size:11px;letter-spacing:.2em;min-height:14px;max-width:38vw;overflow:hidden;white-space:nowrap}
  #note b{color:var(--amber);font-weight:600}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(7,6,14,.08),rgba(7,6,14,.5));z-index:10;
    cursor:pointer;transition:opacity .8s ease}
  #overlay p{font-size:10px;color:var(--ink);letter-spacing:.18em;opacity:.8}
  #overlay.gone{opacity:0;pointer-events:none}
  #play{pointer-events:auto;cursor:pointer;background:none;border:1px solid rgba(255,183,100,.5);
    color:var(--amber);font:inherit;font-size:12px;letter-spacing:.4em;text-transform:uppercase;
    padding:16px 34px 16px 38px;border-radius:999px;transition:all .25s ease}
  #play:hover,#play:focus-visible{background:rgba(255,183,100,.12);border-color:var(--amber);box-shadow:0 0 40px rgba(255,183,100,.25);outline:none}
  #mute{position:fixed;top:18px;right:20px;background:none;border:none;cursor:pointer;
    color:var(--dim);font:inherit;font-size:11px;letter-spacing:.2em;padding:6px}
  #mute:hover{color:var(--ink)}
  #rec{position:fixed;top:46px;right:20px;background:none;border:none;cursor:pointer;
    color:var(--dim);font:inherit;font-size:11px;letter-spacing:.2em;padding:6px}
  #rec:hover,#rec.live{color:#ff7a6b}
  #reccard{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:rgba(7,6,14,.9);z-index:20;color:var(--dim);
    font-size:11px;letter-spacing:.18em}
  #reccard video{max-width:min(86vw,900px);max-height:62vh;border:1px solid rgba(90,97,120,.45);border-radius:12px}
  #reccard .row{display:flex;gap:10px}
  #astate{position:fixed;bottom:20px;right:20px;color:var(--dim);font-size:10px;letter-spacing:.12em;opacity:.75;text-align:right;max-width:55vw}
  #cams{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
  .camb{background:rgba(7,6,14,.55);border:1px solid rgba(90,97,120,.45);color:var(--dim);
    font:inherit;font-size:10px;letter-spacing:.18em;padding:6px 13px;border-radius:999px;cursor:pointer;
    transition:all .2s ease}
  .camb.on{border-color:currentColor;background:rgba(7,6,14,.8)}
  .camb:focus-visible{outline:none;border-color:var(--ink)}
</style>
